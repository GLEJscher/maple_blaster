<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>블래스터 DPM 시뮬레이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 위쪽 고정 바(이름 · 입력/분석 탭 · 실행) 아래에 한 화면씩 보여 주는 두 개의 탭 화면.
   입력 탭은 접히는 구역 카드, 분석 탭은 요약 줄 + 차트/표 카드 */
:root{
  --plane:#f3f3f1; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10); --hover:rgba(11,11,11,.05);
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-wash:rgba(42,120,214,.10);
  --good:#006300; --bad:#b3261e; --bad-wash:rgba(179,38,30,.08); --changed:#b86e00;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --s9:#898781;
  --ui:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"D2Coding",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --hover:rgba(255,255,255,.06);
  --accent:#3987e5; --accent-ink:#0b0b0b; --accent-wash:rgba(57,135,229,.16);
  --good:#0ca30c; --bad:#ff8a80; --bad-wash:rgba(255,138,128,.10); --changed:#f0a93a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --hover:rgba(255,255,255,.06);
  --accent:#3987e5; --accent-ink:#0b0b0b; --accent-wash:rgba(57,135,229,.16);
  --good:#0ca30c; --bad:#ff8a80; --bad-wash:rgba(255,138,128,.10); --changed:#f0a93a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--plane);color:var(--ink);font:14px/1.55 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--plane)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto}

/* 상단 바 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--plane);padding-block:14px 12px;
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;border-bottom:1px solid var(--grid)}
.brand{font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand small{font:400 11px var(--mono);color:var(--muted);letter-spacing:0}
.tabs{display:flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--ring);border-radius:12px}
.tab{border:0;background:transparent;color:var(--ink2);padding:7px 22px;border-radius:9px;cursor:pointer;font-weight:600}
.tab:hover{background:var(--hover)}
.tab[aria-selected="true"]{background:var(--accent-wash);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ring)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grow{flex:1 1 0}
.status{font:12px var(--mono);color:var(--ink2);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.busy{background:var(--s4);animation:pulse 1s ease-in-out infinite}
.dot.ok{background:var(--good)}
.dot.err{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.busy{animation:none}}
.btn{border:1px solid var(--ring);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.small{padding:4px 10px;font-size:12.5px}
.autorun{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:12.5px;white-space:nowrap}

main{padding-block:20px}
.view[hidden]{display:none!important}
.banner{border:1px solid var(--bad);background:var(--bad-wash);color:var(--ink);padding:10px 14px;border-radius:10px;margin-bottom:16px;white-space:pre-wrap;font:12.5px/1.5 var(--mono);overflow-x:auto}
.loading{color:var(--ink2);padding:40px 0;text-align:center}

/* 입력 탭 */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0;padding:8px 12px;border-radius:9px;border:1px solid var(--ring);background:var(--surface)}
.chk{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px;white-space:nowrap}
.presets{margin:0 0 14px;padding:10px 12px;border:1px solid var(--grid);border-radius:12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.prow{display:flex;gap:6px;align-items:center}.plabel{font-weight:700;margin-right:4px}
.pslot{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:78px;padding:6px 12px;border:1px solid var(--ring);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.pslot b{font-size:15px}.pslot .pst{font-size:11px;color:var(--ink2)}
.pslot.on{border-color:var(--accent);background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--accent)}
.pslot.mod .pst{color:var(--accent);font-weight:700}

.preset select{padding:7px 10px;border-radius:9px;border:1px solid var(--ring);background:var(--surface);max-width:180px}
details.group{background:var(--surface);border:1px solid var(--ring);border-radius:12px;margin-bottom:10px}

details.group>summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(-45deg);transition:transform .15s}
details.group[open]>summary::before{transform:rotate(45deg)}
.gcount{font:400 12px var(--mono);color:var(--muted)}
.gchg{font:600 11px var(--ui);color:var(--changed);margin-left:auto}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 18px;padding:4px 16px 16px}
.field{min-width:0}
.field.wide{grid-column:1/-1}
.field[hidden]{display:none!important}
.fhead{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.fname{font:600 12.5px var(--mono);overflow-wrap:anywhere}
.fkor{color:var(--ink2);font-size:12.5px}
.fkor.strong{color:var(--ink);font-weight:700;font-size:13px}
.fname.dim{font-weight:400;color:var(--muted);font-size:11.5px}
.subhead{grid-column:1/-1;font-weight:700;font-size:12.5px;color:var(--ink2);border-bottom:1px solid var(--grid);padding-bottom:4px;margin-top:6px}
.simhelp{grid-column:1/-1}
.simchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.simchip{font:inherit;font-size:12.5px;padding:5px 10px;border:1px solid var(--grid);border-radius:999px;background:var(--surface,transparent);color:var(--ink);cursor:pointer}
.simchip:hover{border-color:var(--ink2)}
.simchip.on{border-color:var(--accent,currentColor);font-weight:600}
.simchip .k{color:var(--ink2)}
.subhead:first-child{margin-top:0}
.subhead[hidden]{display:none!important}
.fchg{font:600 10.5px var(--ui);color:var(--changed);border:1px solid currentColor;border-radius:99px;padding:0 6px;display:none}
.field.changed .fchg{display:inline-block}
.freset{display:none;border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:12px;padding:0 2px;text-decoration:underline}
.field.changed .freset{display:inline}
.fnote{color:var(--ink2);font-size:12px;line-height:1.45;margin:2px 0 6px;overflow-wrap:anywhere}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.num,.txt,.sel{padding:6px 9px;border-radius:8px;border:1px solid var(--ring);background:var(--plane);width:100%;min-width:0;font-variant-numeric:tabular-nums}
.field.changed .num,.field.changed .txt,.field.changed .sel{border-color:var(--changed)}
.field.links.changed .sel{border-color:var(--ring)}.field.links .rowchg .sel{border-color:var(--changed)}
.sub{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px;width:100%}
.sub label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink2);min-width:0}
.sub label span b{font:600 11px var(--mono);color:var(--muted);margin-left:4px}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--grid);font-size:13px;vertical-align:middle}
.tbl th{font-weight:600;color:var(--ink2);font-size:12px}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl.wide{min-width:540px}
.tbl.wide td:first-child{white-space:nowrap}
.tbl .num{width:96px}
.scroll{overflow-x:auto;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--accent-wash);border-radius:99px;padding:1px 10px;font-size:12px}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.row-actions{display:flex;gap:8px;margin-top:8px}
.calc{color:var(--ink2);font:12px var(--mono);padding:2px 0;overflow-wrap:anywhere}
.io{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.io textarea{width:100%;min-height:90px;font:12px var(--mono);background:var(--plane);border:1px solid var(--ring);border-radius:8px;padding:8px}
.io summary{cursor:pointer;font-weight:600}

/* 분석 탭 */
.kpis{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:14px 16px;min-width:0}
.kpi .l{color:var(--ink2);font-size:12.5px}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px}
.kpi.hero .v{font-size:56px;line-height:1.05;letter-spacing:-.02em;font-weight:700}
.kpi.hero .v small{font-size:22px;font-weight:600;margin-left:4px;color:var(--ink2)}
.kpi .d{font-size:12.5px;margin-top:4px;color:var(--ink2)}
.kpi .d.up{color:var(--good)} .kpi .d.down{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px;margin-bottom:16px;min-width:0}
.card h2{font-size:15px;margin:0}
.card .sub2{color:var(--ink2);font-size:12.5px;margin:2px 0 12px}
.cardhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.share{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr);gap:7px 12px;align-items:center}
.share .nm{font-size:13px;overflow-wrap:anywhere}
.share .nm .lv{color:var(--ink2);font-size:11.5px;white-space:nowrap}
.share .track{display:flex;align-items:center;gap:10px;min-width:0}
.share .barx{height:14px;border-radius:0 4px 4px 0;min-width:2px;flex:0 0 auto}
.share .val{font-size:12.5px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.share .val b{color:var(--ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:8px;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.axis text{fill:var(--muted);font:11px var(--ui)}
.axis line,.gridl{stroke:var(--grid);stroke-width:1}
.base{stroke:var(--axis);stroke-width:1}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);border:1px solid var(--ring);box-shadow:0 6px 24px rgba(0,0,0,.25);border-radius:10px;padding:8px 10px;font-size:12.5px;max-width:260px;display:none}
.tip .t{color:var(--ink2);margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .r span{display:flex;align-items:center;gap:6px;color:var(--ink2);min-width:0}
.tip .r i{width:10px;height:3px;border-radius:2px;flex:0 0 auto}
.tip .r b{color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.ordlist{display:flex;flex-direction:column;gap:6px;max-width:420px}
.ordrow{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid var(--grid);border-radius:10px}
.ordrow .no{width:20px;color:var(--muted);font-variant-numeric:tabular-nums}.ordrow .nm{flex:1;font-weight:600}.ordrow .nm small{font-weight:400;color:var(--ink2);margin-left:8px}
.pconf{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-wash)}
.pconf[hidden]{display:none}.pconf .ct{flex:1 1 220px;font-size:12.5px}
.simlist{margin:4px 0 0;padding-left:18px}
.card.extra{padding:12px 16px}.card.extra summary{cursor:pointer;font-weight:700;font-size:15px}.card.extra .sub{margin-bottom:8px}
.card.extra .gcount{margin-left:8px;font-weight:400;font-size:12.5px;color:var(--ink2)}
.kpi .d2{font-size:12px;color:var(--ink2);margin-top:2px;font-weight:400}
.selinfo{margin-top:10px}.selgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.selgrid .st{border:1px solid var(--grid);border-radius:10px;padding:8px 10px;min-width:0}.selgrid .l{font-size:12px;color:var(--ink2)}
.selgrid .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}.selgrid .s{font-size:11.5px;color:var(--ink2);overflow-wrap:anywhere}
.skpick{margin-bottom:12px}.skpick-top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:8px}.skpick-top .lb{font-size:13px}
.skpill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ring);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.skpill i{width:10px;height:10px;border-radius:2px}
.seg{display:inline-flex;gap:4px}.seg .btn[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent)}
.skchips{display:flex;flex-wrap:wrap;gap:6px;max-height:132px;overflow:auto;margin-top:8px;padding:2px}
.skchip{font:inherit;font-size:12.5px;border:1px solid var(--grid);background:transparent;color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.skchip small{margin-left:6px;color:var(--ink2)}.skchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash);font-weight:600}
.skchip[disabled]{opacity:.45;cursor:default}
.legend .unit{margin-left:auto}
@media (max-width:760px){.selgrid{grid-template-columns:1fr 1fr}}
.tv{margin-top:10px}
.tv summary{cursor:pointer;color:var(--ink2);font-size:12.5px}
.tv .scroll{max-height:320px;overflow:auto;margin-top:8px}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
.foot{color:var(--muted);font-size:12px;margin-top:24px}
.foot a{color:var(--ink2)}
@media (max-width:760px){
  .kpis{grid-template-columns:1fr 1fr}.kpi.hero{grid-column:1/-1}.kpi.hero .v{font-size:44px}
  .tab{padding:7px 16px}
  .share{grid-template-columns:minmax(80px,120px) minmax(0,1fr)}
}
.field.off,.subhead.off,.gearintro.off{display:none!important}
.ascnote{margin:0 0 12px;padding:10px 12px;border:1px solid var(--line,#ddd);border-radius:10px;font-size:13px;line-height:1.5}
.ascnote .d2{font-size:12px;opacity:.7;margin-top:2px}
.gearhead{margin:10px 0 4px;font-size:12px;font-weight:700;opacity:.75}
.gear .sub{margin-top:0}
.gline{display:flex;gap:8px;margin-bottom:6px}.gline .sel{flex:1 1 55%;min-width:0}.gline .num{flex:1 1 40%;min-width:0}
.gearintro{grid-column:1/-1;font-size:12.5px;color:var(--ink2);line-height:1.55;margin:-2px 0 2px}
</style>

  <header class="bar">
    <div class="brand">블래스터 DPM 시뮬레이터<small>maple_blaster · 깃허브 코드 그대로 실행</small></div>

/* ============================ 파이썬 시작 ============================ */
async function boot() {
  try {
    const t0 = performance.now();
    const base = new URL("pyodide/", location.href).href;
    const [skills, attr, api] = await Promise.all(["Skills.py", "Attribute.py", "web_api.py"].map(async (p) => {
      const r = await fetch(p); if (!r.ok) throw new Error(p + " 불러오기 실패 (" + r.status + ")"); return r.text();
    }));
    S.py = await loadPyodide({ indexURL: base, stdLibURL: base + "python_stdlib_zip.wasm" });
    S.py.FS.writeFile("/home/pyodide/web_api.py", api);
    S.py.globals.set("SKILLS_SRC", skills); S.py.globals.set("ATTR_SRC", attr);
    S.py.runPython("import sys\nsys.path.insert(0,'/home/pyodide')\nimport web_api as w\nw.set_sources(SKILLS_SRC, ATTR_SRC)");
    const d = JSON.parse(S.py.runPython("w.describe_inputs()"));
    S.items = d.items; S.groups = d.groups; S.gear = d.gear; S.gearIntro = d.gear_intro;
    for (const ks of Object.values(S.gear)) for (const [k, nm] of ks) GEAR_KOR[k] = nm;
    GEAR_KOR.pot = "잠재옵션"; GEAR_KOR.add = "에디셔널 잠재옵션";
    for (const it of S.items) { S.byName[it.name] = it; if (it.kind !== "calc" && it.kind !== "other") S.defaults[it.name] = clone(it.value); }
    if (BLANK) for (const n of [...BLANK_ITEMS, ...GEAR_NAMES]) if (S.defaults[n]) S.defaults[n] = Object.fromEntries(Object.entries(S.defaults[n]).map(([k, v]) => [k, Array.isArray(v) ? v : null]));
    S.values = clone(S.defaults);
    const saved = store.get("blaster-dpm:current");
    if (saved && typeof saved === "object") applyOverrides(saved, false);
    buildInputs();
    $("#run").disabled = false;
    setStatus("ok", "준비 완료 (" + Math.round(performance.now() - t0) + "ms)");
    await runSim();
  } catch (e) {
    setStatus("err", "시작 실패"); showError("파이썬을 시작하지 못했습니다.\n" + (e && e.message || e));
    $("#inputs").textContent = "";
  }
}

}
const RANGE_LIM = {            // 분석 구간은 시뮬레이션 시간 안에 있어야 한다: 0 <= t_0 <= t_n <= SIM_TIME
  SIM_TIME: { min: () => 1, max: () => 1200 },

function tableView(label, head, rows) {

function renderTable(card, r) {

      el("tbody", {}, rows.map((s) => el("tr", {}, el("td", { text: s.name }), el("td", { class: "r", text: fmtJo(s.total) }), el("td", { class: "r", text: fmt(s.share * 100, 2) + "%" }),
        el("td", { class: "r", text: fmt(s.count, 0) }), el("td", { class: "r", text: fmtEok(s.avg) }), el("td", { class: "r", text: fmtEok(s.max_hit) }))))));
  };
  draw();
}

/* ============================ 추가 스펙 (분석 탭) ============================ */
const EXTRA_KEYS = ["mainStat", "mainStatp", "fixedMainStat", "subStat", "subStatp", "fixedSubStat", "attack", "attackp", "damage",
                    "bossDamage", "armorIgnore", "finalDamage", "critDamage", "attribResist", "buffDuration", "cooldown"];
S.extra = (() => { const v = store.get("blaster-dpm:extra"); return v && typeof v === "object" ? v : {}; })();
const cleanOf = (src) => { const o = {}; for (const k of EXTRA_KEYS) { const v = Number(src[k]); if (isFinite(v) && v !== 0) o[k] = v; } return o; };
S.extraApplied = (() => { const v = store.get("blaster-dpm:extra-applied"); return v && typeof v === "object" ? cleanOf(v) : {}; })();
function extraClean() { return S.extraApplied; }          // 계산에는 "계산" 버튼으로 반영한 값만 쓴다
function buildExtra() {
  const root = $("#extra"); root.textContent = "";
  const ins = {};
  const summary = el("summary", {}, "추가 스펙", el("span", { class: "gcount", id: "extra-cnt" }));
  const grid = el("div", { class: "sub" });
  for (const k of EXTRA_KEYS) {
    const i = el("input", { class: "num", id: "x-" + k, type: "number", step: "any", inputmode: "decimal", placeholder: "0" });
    i.value = S.extra[k] ? S.extra[k] : "";
    i.addEventListener("input", () => { const v = i.value === "" ? 0 : Number(i.value); S.extra[k] = isFinite(v) ? v : 0; store.set("blaster-dpm:extra", S.extra); state(); });
    i.addEventListener("keydown", (e) => { if (e.key === "Enter") apply(); });
    ins[k] = i; grid.append(el("label", { for: "x-" + k }, el("span", {}, STAT_KOR[k] || k, el("b", { text: k })), i));
  }
  const reset = el("button", { class: "btn small", type: "button", onclick: () => { for (const k of EXTRA_KEYS) { S.extra[k] = 0; ins[k].value = ""; } store.set("blaster-dpm:extra", S.extra); apply(); } }, "모두 0으로 하고 계산");
  const applyB = el("button", { class: "btn primary", type: "button", onclick: () => apply() }, "추가 스펙으로 계산");
  const hint = el("span", { class: "fnote", role: "status" });
  const d = el("details", { class: "card extra" }, summary,
    el("p", { class: "sub2", text: "지금 입력(스탯창 스펙)에 더해서 계산해 보는 칸입니다. 입력 탭의 스탯은 바뀌지 않고, 모두 0이면 추가가 없습니다. 예: 최종 데미지 % 10 → base_spec + CharaInfo(finalDamage=10). 방어율 무시와 최종 데미지는 기존 값과 곱해서 합쳐집니다." }),
    grid, el("div", { class: "row-actions" }, applyB, reset, hint));
  root.append(d);

    const draft = cleanOf(S.extra), ap = extraClean(), diff = !same(draft, ap), n = Object.keys(ap).length;
    $("#extra-cnt").textContent = n ? n + "개 반영 중" : "반영 없음";
    applyB.disabled = !diff && !!S.result;
    hint.textContent = diff ? "입력한 값이 아직 계산에 반영되지 않았어요. 버튼을 누르면 한 번에 계산합니다." : n ? "지금 결과에 반영되어 있습니다. 위 총 데미지에서 '추가 스펙 없는 값 대비'를 볼 수 있어요." : "";

    S.extraApplied = cleanOf(S.extra); store.set("blaster-dpm:extra-applied", S.extraApplied); state();
    S.dirty = true; if (S.refreshRec) S.refreshRec(); clearTimeout(S.timer); S.timer = setTimeout(runSim, 30);
  }
  S.extraState = state;
  state(); d.open = true;
}

}
